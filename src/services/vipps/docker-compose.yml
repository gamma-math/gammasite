services:
  connection:
    build: .
    env_file: .env
    command: ["--check"]
    profiles: ["manual"]

  payment:
    build: .
    env_file: .env
    command: ["--payment"]
    profiles: ["manual"]

  payment-status:
    build: .
    env_file: .env
    command: ["--status"]
    profiles: ["manual"]

  payment-capture:
    build: .
    env_file: .env
    command: ["--capture"]
    profiles: ["manual"]

  create-agreement:
    build: .
